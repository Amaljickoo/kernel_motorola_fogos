name: Build Moto G45 (fogos) Stock-Safe Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6375
          ref: lineage-22.1  # Targeting Android 15 branch
          fetch-depth: 1

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git kmod libssl-dev libelf-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu pahole

      - name: Setup Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 tools/clang

      - name: Integrate KernelSU (Official)
        run: |
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s main

      - name: Integrate SUSFS (v1.5.5+ for 5.4)
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 --depth=1 susfs_src
          # Copy SUSFS core files to the kernel tree
          cp susfs_src/kernel_patched/fs/susfs.c fs/
          cp susfs_src/kernel_patched/include/linux/susfs.h include/linux/
          
          # Patch KernelSU to recognize SUSFS
          # Using '|| true' to prevent workflow failure if the patch is already partially present
          patch -p1 < susfs_src/kernel_patched/KernelSU/10_enable_susfs_for_ksu.patch || true
          
          # Patch Kernel 5.4 core for SUSFS support
          patch -p1 < susfs_src/kernel_patched/5.4/50_add_susfs_in_kernel-5.4.patch || true

      - name: Configure Kernel
        run: |
          export PATH=$PWD/tools/clang/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Use the fogos specific config
          # IF THIS STEP FAILS: Check the 'arch/arm64/configs/' folder for the correct name
          make O=out ARCH=arm64 vendor/fogos_defconfig
          
          # MATCH YOUR VERSION EXACTLY (Crucial for modules/Wi-Fi)
          # We force the Makefile to match your 5.4.274 version
          sed -i "s/^SUBLEVEL = .*/SUBLEVEL = 274/" Makefile
          
          # Enable KSU & SUSFS in the config
          ./scripts/config --file out/.config -e CONFIG_KERNELSU
          ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS
          ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS_HAS_MAGIC_MOUNT
          
          # Apply config changes
          make O=out ARCH=arm64 olddefconfig

      - name: Build the Kernel
        run: |
          export PATH=$PWD/tools/clang/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          
          # Compile the Image
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu-

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-G45-fogos-KSU-SUSFS
          path: out/arch/arm64/boot/Image
